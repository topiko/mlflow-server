services:
  postgres:
    image: postgres:14.19@sha256:1c418702ab77adc7e84c7e726c2ab4f9cb63b8f997341ffcfab56629bab1429d
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mlflow_server:
    restart: always
    build: ./mlflow
    image: mlflow_server_with_boto3
    container_name: mlflow_server
    networks:
      - backend
    environment:
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true # Nginx provides the public gate.
      - TMPDIR=/mlflow_data/tmp
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --host 0.0.0.0
      --workers 1
      --serve-artifacts
      --artifacts-destination /mlflow_artifacts
    volumes:
      - ./mlflow_data:/mlflow_data
      - ./artifacts_data:/mlflow_artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).close()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  nginx:
    restart: unless-stopped
    image: nginx:1.28.0-alpine@sha256:8f2bcf97c473dfe311e79a510ee540ee02e28ce1e6a64e1ef89bfad32574ef10
    container_name: mlflow_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot_data:/etc/letsencrypt
    depends_on:
      mlflow_server:
        condition: service_healthy
        restart: true
    networks:
      - backend

  certbot:
    profiles: ["tools"]
    build: ./certbot
    user: "1001:1001"
    container_name: certbot
    environment:
      - PORKBUN_API_KEY=${PORKBUN_API_KEY}
      - PORKBUN_SECRET_API_KEY=${PORKBUN_API_SECRET}
    volumes:
      - ./certbot_data:/etc/letsencrypt
      - ./certbot_log:/var/log/letsencrypt
      - ./certbot_work:/var/lib/letsencrypt
    command: >
      certonly
             --non-interactive
             --agree-tos
             --email topiko1987@gmail.com
             --dns-porkbun-credentials /etc/letsencrypt/creds.ini
             --preferred-challenges dns
             --authenticator dns-porkbun
             --dns-porkbun-propagation-seconds 60
             -d ml.twohands.dev

networks:
  backend:
    driver: bridge
